[project]
name = "shunda-finance"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django~=5.2.0",
  "dj-database-url~=2.3",
  "psycopg[binary]~=3.2",
  "gunicorn~=23.0",
  "whitenoise~=6.9",
  "openpyxl~=3.1",
  "xlrd~=2.0",
  "pypdf~=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.3",
  "pytest-django~=4.11",
  "pytest-cov~=6.1",
  "PyYAML~=6.0",
  "ruff~=0.11",
  "xlwt~=1.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["apps", "config", "scripts", "manage"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
